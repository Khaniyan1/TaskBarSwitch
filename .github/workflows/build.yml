name: Build

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: dotnet build -c Release
      - uses: actions/upload-artifact@v7
        with:
          name: TaskbarSwitch-${{ github.ref_name }}-${{ github.sha }}
          path: bin/Release/net48/TaskbarSwitch.exe
